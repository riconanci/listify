name: ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Placeholder only. Prisma needs the variable to exist to read the schema,
      # and the build never connects to it.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/listify?schema=public"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Prisma: generate client & validate schema (no DB needed)
      - run: npx prisma generate
      - run: npx prisma validate

      - run: npm run typecheck

      # Lint is not run here yet: ESLint is not installed, and `next lint`
      # exits with an error when it has no config to use.

      - run: npm run build
